name: Build MoonKits
on:
  push:
    branches: ["main"]
    paths:
      - "MoonKits/**"
      - ".github/workflows/moonkits.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MoonKits
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: MoonKits/pom.xml
      - name: Build MoonKits
        run: mvn --batch-mode clean package
      - name: Upload MoonKits JAR
        uses: actions/upload-artifact@v4
        with:
          name: MoonKits-1.0.0
          path: MoonKits/target/MoonKits-1.0.0.jar
          if-no-files-found: error
