name: Build plugin
on:
  push:
    branches: [ "main", "feature/economicmooneclips-1.8.0" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn --batch-mode clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EconomicMoonEclips-1.8.0
          path: target/EconomicMoonEclips-1.7.0.jar
          if-no-files-found: error